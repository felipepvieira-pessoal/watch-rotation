<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Watch Rotation"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Watch Rotation</title><style>
:root{color-scheme:dark;--bg:#101113;--panel:#1b1d20;--panel2:#25272b;--line:#34363b;--text:#f4f0e8;--muted:#a5a3a0;--gold:#d5b77c;--red:#f09a96}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{padding:calc(env(safe-area-inset-top) + 23px) 22px 16px;max-width:720px;margin:auto}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:700}.brand{font-size:26px;font-weight:650;letter-spacing:-.7px;margin-top:5px}.subtitle{color:var(--muted);margin-top:6px;font-size:13px}main{max-width:720px;margin:auto;padding:0 18px calc(105px + env(safe-area-inset-bottom))}.view{display:none}.view.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:18px;margin:12px 0}.section-title{font-size:19px;font-weight:650;margin:25px 4px 12px}.muted{color:var(--muted)}.small{font-size:12px}.gold{color:var(--gold)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.pill{border:1px solid #62563d;border-radius:50px;color:var(--gold);font-size:11px;padding:5px 9px}.btn{background:var(--gold);color:#151514;border:0;border-radius:12px;padding:13px 16px;font-weight:700}.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#3b2324;color:#ffb2ae}.btn.smallbtn{padding:8px 11px;font-size:12px}.full{width:100%}.watch-icon{height:52px;width:42px;flex:0 0 42px;position:relative;display:grid;place-items:center}.watch-icon:before{content:"";position:absolute;width:17px;height:49px;border-radius:5px;background:linear-gradient(90deg,#52565a,#a1a4a4,#484a4e)}.watch-icon:after{content:"";position:absolute;width:37px;height:37px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#41474c,#15191c 65%);border:3px solid #b7b8b3;box-shadow:0 0 0 2px #4c4c49}.watch-icon span{position:relative;z-index:1;font-size:10px;color:#e8e0c9}.watch-photo{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#26282a}.watch-item{padding:12px 0;border-bottom:1px solid var(--line)}.watch-item:last-child{border-bottom:0}.grow{flex:1;min-width:0}.name{font-weight:650;line-height:1.35}.tag{font-size:11px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 9px;text-align:center}.metric strong{display:block;font-size:25px;font-weight:650;color:var(--gold)}.metric span{font-size:11px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#18191bea;border-top:1px solid var(--line);padding:11px 8px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(14px);z-index:10}nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;min-width:68px}nav button.active{color:var(--gold)}nav .symbol{font-size:22px}.form-label{display:block;color:var(--muted);font-size:12px;margin:14px 0 6px}input,select{width:100%;background:var(--panel2);color:var(--text);border:1px solid #45464a;border-radius:11px;padding:12px;min-height:45px}input[type=file]{font-size:12px}dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);width:min(92vw,480px);max-height:85vh;overflow:auto;padding:20px}dialog::backdrop{background:#000b}.dialog-title{font-size:21px;font-weight:650;margin:0 0 10px}.actions{display:flex;gap:8px;margin-top:20px}.actions>*{flex:1}.empty{text-align:center;padding:25px 8px;color:var(--muted)}.history-day{margin:14px 0}.history-date{font-size:12px;color:var(--gold);margin-bottom:7px}.barrow{margin:15px 0}.barline{height:9px;background:var(--panel2);border-radius:20px;overflow:hidden;margin-top:7px}.barfill{height:100%;background:linear-gradient(90deg,#90734b,#d5b77c);border-radius:20px}.seg{display:flex;gap:7px;margin:12px 0}.seg button{flex:1;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:10px;border-radius:10px}.seg button.active{background:#3a3328;color:var(--gold);border-color:#796647}.note{font-size:12px;color:var(--muted);line-height:1.5}.top-gap{margin-top:18px}.hide{display:none!important}a{color:var(--gold)}
</style></head><body><header><div class="eyebrow">YOUR TIME · YOUR COLLECTION</div><div class="brand">Watch Rotation <span class="gold">✦</span></div><div class="subtitle" id="header-subtitle">Seu rodízio, no seu ritmo.</div></header><main><section class="view active" id="today"></section><section class="view" id="collection"></section><section class="view" id="history"></section><section class="view" id="stats"></section></main><nav><button data-tab="today" class="active"><span class="symbol">⌂</span>Hoje</button><button data-tab="collection"><span class="symbol">◉</span>Coleção</button><button data-tab="history"><span class="symbol">▦</span>Histórico</button><button data-tab="stats"><span class="symbol">▥</span>Estatísticas</button></nav><dialog id="modal"></dialog><script>
const KEY='watch-rotation-v1';const seed=[['Longines Spirit 37','Preto',['Bracelete de aço','NATO preta','Sailcloth azul','Couro marrom']],['Raymond Weil Maestro','Azul',['Couro preto original','Couro marrom','Angus Jubilee']],['YPY GMT','',['Jubilee','Borracha laranja','NATO']],['Orient Star Open Heart','',['Bracelete de aço']],['Citizen Tsuyosa','Azul',['Bracelete integrado']],['Seiko Speedtimer SSB425','',['NATO preta','Bracelete de aço','Couro cognac']],['Citizen Quartz','Branco',['Jubilee','Couro preto']],['Orient Small Seconds','Azul',['Oyster','Jubilee','Couro marrom']]];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.watches)||!Array.isArray(state.logs)){state={watches:seed.map((x,i)=>({id:'w'+i,name:x[0],dial:x[1],straps:x[2],photo:'',archived:false})),logs:[]}}let tab='today',period='month';const $=s=>document.querySelector(s),today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateFmt=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});const shortDate=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{alert('Armazenamento cheio. Exporte um backup e use fotos menores.');return false}};const active=()=>state.watches.filter(w=>!w.archived);const find=id=>state.watches.find(w=>w.id===id);const photo=w=>w.photo?`<img class="watch-photo" src="${w.photo}" alt="">`:`<div class="watch-icon"><span>✦</span></div>`;const count=(id,logs=state.logs)=>logs.filter(l=>l.watchId===id).length;const last=id=>state.logs.filter(l=>l.watchId===id).map(l=>l.date).sort().at(-1);const daysSince=id=>{let x=last(id);return x?Math.round((new Date(today()+'T12:00:00')-new Date(x+'T12:00:00'))/86400000):null};function render(){const now=today(),daily=state.logs.filter(l=>l.date===now),used=new Set(daily.map(l=>l.watchId));$('#header-subtitle').textContent=new Date(now+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});$('#today').innerHTML=`<div class="row between"><h2 class="section-title">Relógios de hoje</h2><span class="pill">${daily.length} registro${daily.length===1?'':'s'}</span></div><div class="card">${daily.length?daily.map(l=>{let w=find(l.watchId);return `<div class="row watch-item">${w?photo(w):''}<div class="grow"><div class="name">${esc(w?.name||'Relógio removido')}</div><div class="tag">${esc(l.strap||'Sem pulseira informada')}</div></div><button class="btn secondary smallbtn" data-remove-log="${esc(l.id)}">Remover</button></div>`}).join(''):'<div class="empty">Nenhum relógio registrado hoje.<br>Escolha abaixo para começar.</div>'}</div><h2 class="section-title">Registrar uso</h2><div class="card">${active().length?active().map(w=>`<div class="row watch-item">${photo(w)}<div class="grow"><div class="name">${esc(w.name)}</div><div class="tag">${used.has(w.id)?'✓ Já registrado hoje':last(w.id)?'Último uso: '+shortDate(last(w.id)):'Ainda sem registros'}</div></div><button class="btn smallbtn ${used.has(w.id)?'secondary':''}" data-log="${esc(w.id)}">+ Usar</button></div>`).join(''):'<div class="empty">Adicione um relógio na coleção.</div>'}</div><p class="note">Você pode registrar mais de um relógio por dia e escolher a pulseira em cada uso.</p>`;$('#collection').innerHTML=`<div class="row between"><h2 class="section-title">Minha coleção</h2><button class="btn smallbtn" id="add-watch">+ Adicionar</button></div><div class="card">${state.watches.map(w=>`<div class="row watch-item">${photo(w)}<div class="grow"><div class="name">${esc(w.name)}</div><div class="tag">${esc(w.dial||'Mostrador não informado')} · ${w.straps.length} pulseira(s) ${w.archived?'· ARQUIVADO':''}</div></div><button class="btn secondary smallbtn" data-edit="${esc(w.id)}">Editar</button></div>`).join('')}</div><p class="note">Os relógios iniciais são sugestões editáveis. Arquive os que não fazem mais parte da coleção.</p><div class="card"><div class="name">Seus dados</div><p class="note">Os registros ficam neste navegador. Exporte backups regularmente; limpar os dados do Safari pode apagá-los.</p><div class="actions"><button class="btn secondary" id="export">Exportar backup</button><button class="btn secondary" id="import-btn">Importar backup</button></div><input id="import-file" class="hide" type="file" accept="application/json,.json"></div>`;let grouped={};[...state.logs].sort((a,b)=>b.date.localeCompare(a.date)).forEach(l=>(grouped[l.date]??=[]).push(l));$('#history').innerHTML=`<div class="row between"><h2 class="section-title">Histórico de uso</h2><button class="btn secondary smallbtn" id="add-past">+ Registrar data</button></div>${Object.keys(grouped).length?Object.entries(grouped).map(([d,logs])=>`<div class="history-day"><div class="history-date">${dateFmt(d)}</div><div class="card">${logs.map(l=>{let w=find(l.watchId);return `<div class="row watch-item">${w?photo(w):''}<div class="grow"><div class="name">${esc(w?.name||'Relógio removido')}</div><div class="tag">${esc(l.strap||'Sem pulseira')}</div></div><button class="btn secondary smallbtn" data-remove-log="${esc(l.id)}">Excluir</button></div>`}).join('')}</div></div>`).join(''):'<div class="card empty">Seus registros aparecerão aqui.</div>'}`;let start=period==='month'?now.slice(0,7)+'-01':period==='year'?now.slice(0,4)+'-01-01':'0000-01-01';let logs=state.logs.filter(l=>l.date>=start&&l.date<=now);let sorted=[...active()].map(w=>({w,n:count(w.id,logs)})).sort((a,b)=>b.n-a.n);let max=Math.max(1,...sorted.map(x=>x.n));let uniqueDays=new Set(logs.map(l=>l.date)).size;$('#stats').innerHTML=`<h2 class="section-title">Estatísticas</h2><div class="seg"><button data-period="month" class="${period==='month'?'active':''}">Este mês</button><button data-period="year" class="${period==='year'?'active':''}">Este ano</button><button data-period="all" class="${period==='all'?'active':''}">Todo período</button></div><div class="grid"><div class="metric"><strong>${logs.length}</strong><span>Usos</span></div><div class="metric"><strong>${uniqueDays}</strong><span>Dias registrados</span></div><div class="metric"><strong>${new Set(logs.map(l=>l.watchId)).size}</strong><span>Relógios usados</span></div></div><h2 class="section-title">Ranking de utilização</h2><div class="card">${sorted.map(({w,n})=>`<div class="barrow"><div class="row between"><span class="name">${esc(w.name)}</span><span class="gold">${n} · ${logs.length?Math.round(n/logs.length*100):0}%</span></div><div class="barline"><div class="barfill" style="width:${n/max*100}%"></div></div></div>`).join('')||'<div class="empty">Sem relógios ativos.</div>'}</div><h2 class="section-title">Há quanto tempo sem uso?</h2><div class="card">${active().slice().sort((a,b)=>(daysSince(b.id)??99999)-(daysSince(a.id)??99999)).map(w=>`<div class="row between watch-item"><span>${esc(w.name)}</span><span class="gold small">${daysSince(w.id)===null?'Nunca registrado':daysSince(w.id)===0?'Usado hoje':daysSince(w.id)+' dia(s)'}</span></div>`).join('')}</div><p class="note">Cada registro conta como um uso, inclusive quando você utiliza mais de um relógio no mesmo dia.</p>`;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===tab));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}const modal=$('#modal');function openModal(html){modal.innerHTML=html;modal.showModal()}function closeModal(){modal.close()}function logForm(wid,date=today()){let w=find(wid),straps=w?.straps||[];openModal(`<h3 class="dialog-title">Registrar uso</h3><form id="log-form"><label class="form-label">Relógio</label><select name="watchId" required>${active().map(x=>`<option value="${esc(x.id)}" ${x.id===wid?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label class="form-label">Data</label><input name="date" type="date" max="${today()}" value="${date}" required><label class="form-label">Pulseira</label><select name="strap" id="strap-select"></select><div class="actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn" type="submit">Salvar uso</button></div></form>`);updateStraps(wid)}function updateStraps(id){let w=find(id),s=$('#strap-select');if(!s)return;s.innerHTML='<option value="">Não informar</option>'+(w?.straps||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}function watchForm(id){let w=find(id);openModal(`<h3 class="dialog-title">${w?'Editar relógio':'Novo relógio'}</h3><form id="watch-form" data-id="${esc(id||'')}"><label class="form-label">Modelo</label><input name="name" maxlength="100" value="${esc(w?.name||'')}" required><label class="form-label">Cor do mostrador (opcional)</label><input name="dial" maxlength="50" value="${esc(w?.dial||'')}"><label class="form-label">Pulseiras (uma por linha)</label><textarea name="straps" style="width:100%;height:100px;background:var(--panel2);color:var(--text);border:1px solid #45464a;border-radius:11px;padding:12px;font:inherit">${esc((w?.straps||[]).join('\n'))}</textarea><label class="form-label">Foto do relógio (opcional)</label><input name="photo" type="file" accept="image/*"><p class="note">A imagem será reduzida e guardada no aparelho.</p>${w?`<label class="row top-gap"><input style="width:auto;min-height:auto" name="archived" type="checkbox" ${w.archived?'checked':''}> Arquivado / fora da coleção</label>`:''}<div class="actions"><button type="button" class="btn secondary" data-close>Cancelar</button><button type="submit" class="btn">Salvar</button></div></form>`)}function makeId(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function resizeImage(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>reject(Error('Imagem inválida'));img.src=url})}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo(0,0)}else if(b.dataset.log)logForm(b.dataset.log);else if(b.dataset.edit)watchForm(b.dataset.edit);else if(b.id==='add-watch')watchForm();else if(b.dataset.close!==undefined)closeModal();else if(b.dataset.removeLog){if(confirm('Excluir este registro?')){state.logs=state.logs.filter(l=>l.id!==b.dataset.removeLog);save();render()}}else if(b.id==='add-past')logForm(active()[0]?.id||'',today());else if(b.dataset.period){period=b.dataset.period;render()}else if(b.id==='export'){let blob=new Blob([JSON.stringify({...state,version:1,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='watch-rotation-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}else if(b.id==='import-btn')$('#import-file').click()});document.addEventListener('change',async e=>{if(e.target.name==='watchId')updateStraps(e.target.value);if(e.target.id==='import-file'){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.watches)||!Array.isArray(d.logs)||d.watches.some(w=>typeof w.id!=='string'||typeof w.name!=='string'||!Array.isArray(w.straps))||d.logs.some(l=>typeof l.watchId!=='string'||typeof l.date!=='string'))throw Error('Formato inválido');if(confirm('Substituir todos os dados atuais pelos do backup?')){state={watches:d.watches,logs:d.logs};save();render();alert('Backup importado.')}}catch(err){alert('Não foi possível importar: '+err.message)}e.target.value=''}});document.addEventListener('submit',async e=>{if(e.target.id==='log-form'){e.preventDefault();let f=new FormData(e.target),date=f.get('date'),watchId=f.get('watchId');if(!find(watchId)||date>today()||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return alert('Confira a data e o relógio.');state.logs.push({id:makeId(),watchId,date,strap:f.get('strap')});save();closeModal();render()}else if(e.target.id==='watch-form'){e.preventDefault();let f=new FormData(e.target),id=e.target.dataset.id,w=find(id),file=f.get('photo'),photo=w?.photo||'';if(file&&file.size){try{photo=await resizeImage(file)}catch{return alert('Não foi possível processar a foto.')}}let obj={id:w?.id||makeId(),name:String(f.get('name')).trim(),dial:String(f.get('dial')).trim(),straps:String(f.get('straps')).split('\n').map(x=>x.trim()).filter(Boolean),photo,archived:f.get('archived')==='on'};if(!obj.name)return alert('Informe o modelo.');if(w)Object.assign(w,obj);else state.watches.push(obj);save();closeModal();render()}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
